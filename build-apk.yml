name: Build Android APK

# Trigger: every push to main/master + manual trigger via GitHub UI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger button in Actions tab

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout repository ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 (required by Android Gradle Plugin) ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Set up Flutter ──────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true   # Cache Flutter SDK between runs

      # ── 4. Cache Gradle dependencies ───────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 5. Cache Pub (Dart) packages ───────────────────────
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # ── 6. Verify Flutter installation ─────────────────────
      - name: Flutter doctor
        run: flutter doctor -v

      # ── 7. Generate Android platform files ─────────────────
      # (Our starter project ships only with lib/, so we let Flutter
      #  scaffold the android/ folder on the fly.)
      - name: Generate Android folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name nextai --org com.nextai --no-pub .
          fi

      # ── 8. Install Dart dependencies ───────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 9. Static analysis (optional but recommended) ──────
      - name: Analyze code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      # ── 10. Build DEBUG APK (no signing key required) ──────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 11. Build RELEASE APK (unsigned) ───────────────────
      # NOTE: For Play Store upload, you need a signing key.
      # Set it up later via Secrets > KEYSTORE_BASE64, KEY_ALIAS, etc.
      - name: Build release APK (unsigned)
        run: flutter build apk --release
        continue-on-error: true

      # ── 12. Upload debug APK as workflow artifact ──────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nextai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 13. Upload release APK if it exists ────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      # ── 14. Build summary ──────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## 📱 APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            SIZE=$(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)
            echo "✅ **Debug APK**: \`$SIZE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Debug APK build failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
            echo "✅ **Release APK (unsigned)**: \`$SIZE\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download APKs from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY

name: Create GitHub Release with APK

# Trigger only on version tags like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Required to create release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name nextai --org com.nextai --no-pub .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: List generated APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Next AI ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📱 Next AI ${{ github.ref_name }}

            Automatically built APK from Flutter starter project.

            ### 📥 Downloads
            - **app-arm64-v8a-release.apk** — Modern 64-bit ARM (most devices 2017+)
            - **app-armeabi-v7a-release.apk** — Older 32-bit ARM
            - **app-x86_64-release.apk** — Emulators & x86 devices

            ### ⚠️ Note
            APKs are unsigned — install with "Unknown sources" enabled.
            For Play Store, set up signing keys via repo Secrets.
          files: |
            build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
